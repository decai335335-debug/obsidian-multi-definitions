name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify version
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME;
          for (const file of ["manifest.json", "package.json"]) {
            const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (version !== tag) throw new Error(`${file} version ${version} does not match ${tag}`);
          }
          NODE

      - name: Check and build
        run: |
          pnpm run check
          pnpm run build
          node --check main.js

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            manifest.json \
            main.js \
            styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes "Multi Definitions $GITHUB_REF_NAME release assets built and attested by GitHub Actions."

